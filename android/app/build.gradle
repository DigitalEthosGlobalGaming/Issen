apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def buildNumber = (System.getenv('ISSEN_ANDROID_VERSION_CODE') ?: '1').toLong()
if (buildNumber < 1 || buildNumber > 2100000000) {
    throw new GradleException('ISSEN_ANDROID_VERSION_CODE must be between 1 and 2100000000.')
}
def uploadStore = System.getenv('ISSEN_UPLOAD_STORE_FILE')
def hasUploadSigning = uploadStore && System.getenv('ISSEN_UPLOAD_STORE_PASSWORD') &&
    System.getenv('ISSEN_UPLOAD_KEY_ALIAS') && System.getenv('ISSEN_UPLOAD_KEY_PASSWORD')

android {
    namespace = "com.digitalethosglobalgaming.issen"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.digitalethosglobalgaming.issen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = buildNumber.toInteger()
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('ISSEN_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('ISSEN_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ISSEN_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasUploadSigning) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'FULL'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Never silently produce an unsigned Play Store candidate.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'assembleRelease'] }) {
        def webAssets = file('src/main/assets/public/assets')
        if (webAssets.exists() && fileTree(webAssets).matching { include '**/*.js' }.any {
            (it.getText('UTF-8') =~ /test_[A-Za-z0-9]{10,}/).find()
        }) {
            throw new GradleException('RevenueCat Test Store keys are forbidden in release assets. Use a goog_ SDK key and sync again.')
        }
    }
    if (graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'assembleRelease'] }
        && !hasUploadSigning) {
        throw new GradleException('Release signing is missing. Configure ISSEN_UPLOAD_* environment variables; see docs/development/android.md.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
