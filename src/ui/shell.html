<div id="app">
  <canvas id="c" aria-label="Issen game scene"></canvas>
  <div id="sceneLoadingTreatment" role="status">Preparing scenery</div>

  <div id="hud">
    <div>
      <span id="score">0</span><span id="combo"></span><span id="badges"></span
      ><span id="lives"></span>
      <small id="fpsCounter" hidden></small>
    </div>
    <div id="waveLbl"></div>
    <div class="hbtns">
      <button id="pauseBtn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6.5" y="5" width="3.6" height="14" rx="1" />
          <rect x="13.9" y="5" width="3.6" height="14" rx="1" />
        </svg></button
      ><button id="mute" type="button" aria-label="Toggle sound"></button>
    </div>
  </div>
  <div id="bossbar">
    <div id="bossK"></div>
    <div id="bossN"></div>
    <div id="bossHp"></div>
  </div>
  <div id="banner">
    <div class="k"></div>
    <div class="l"></div>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>

  <!-- screen:title -->

  <!-- screen:game-over -->

  <!-- screen:armory -->

  <!-- screen:stats -->

  <!-- screen:setup -->

  <!-- screen:shrine -->

  <!-- screen:pause -->
  <!-- screen:trials -->
  <!-- screen:support -->
  <!-- screen:options -->
  <div id="trialObjective" hidden></div>
  <div id="testBadge" hidden>TEST PROFILE</div>
  <div id="template" class="screen panel">
    <div class="box">
      <div class="temple-header">
        <h2>Temple</h2>
        <button class="btn" type="button" data-back>Done</button>
      </div>
      <div id="templateContent"></div>
    </div>
  </div>
  <div id="admin" class="screen panel">
    <div class="box">
      <div id="adminContent"></div>
      <button class="btn back" type="button" data-back>Back</button>
    </div>
  </div>
</div>
