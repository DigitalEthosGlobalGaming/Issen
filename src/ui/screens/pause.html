<div id="paused" class="screen">
  <div class="pause-layout">
    <div class="pause-heading">
      <div class="o-k">止</div>
      <div class="o-sub">Paused</div>
      <div class="o-sub" id="pauseSeed"></div>
    </div>
    <section class="pause-blessings" aria-label="Current blessings">
      <h2>Blessings</h2>
      <div
        id="pauseBlessings"
        class="pause-blessing-list"
        role="region"
        aria-label="Current blessings"
        tabindex="0"
      ></div>
    </section>
    <div class="pause-actions">
      <button class="btn primary" id="bResume" type="button">Continue</button>
      <button class="btn" id="bPauseOptions" type="button">Options</button>
      <div class="row"><button class="btn" id="bEnd" type="button">End run</button></div>
    </div>
  </div>
</div>
