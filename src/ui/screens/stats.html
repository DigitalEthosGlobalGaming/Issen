<div id="stats" class="screen panel">
  <div class="box">
    <div class="ph">記録<span>Stats</span></div>
    <div class="stats" id="statGrid"></div>
    <button class="btn back" type="button" data-back>Back</button>
    <div class="profile-reset">
      <button class="btn danger" id="bResetProfile" type="button">Reset profile</button>
    </div>
    <dialog
      id="resetProfileDialog"
      aria-labelledby="resetProfileTitle"
      aria-describedby="resetProfileWarning"
    >
      <h2 id="resetProfileTitle">Reset your profile?</h2>
      <p id="resetProfileWarning">
        This permanently deletes all records, unlocks, awakenings, Temple upgrades, Embers and
        settings for this profile. You will start again from the beginning. This cannot be undone.
      </p>
      <p id="resetProfileScope"></p>
      <p id="resetProfileError" role="alert" hidden></p>
      <div class="reset-actions">
        <button class="btn" id="bCancelResetProfile" type="button" autofocus>Cancel</button>
        <button class="btn danger" id="bConfirmResetProfile" type="button">
          Delete all progress
        </button>
      </div>
    </dialog>
  </div>
</div>
