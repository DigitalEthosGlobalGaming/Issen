    <div class="t-k">一閃</div>
    <div class="seal">一閃</div>
  </div>
  <div class="sub">Issen, a single stroke</div>
  <ul class="rules">
    <li>
      <b>→</b
      ><span
        >Swipe the way each blade points. Wait for the red arc on his ring for a perfect cut.</span
      >
    </li>
    <li>
      <b class="red">一</b
      ><span>Later they strike in order. Cut the one wearing the first red seal.</span>
    </li>

  <small class="title-version">v1.1.0</small>
